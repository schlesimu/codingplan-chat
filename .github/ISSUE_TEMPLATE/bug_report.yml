name: Bug 报告
about: 小纸船哪里坏了、卡了、显示不对
labels: bug

body:
  - type: markdown
    attributes:
      value: |
        谢谢反馈。请尽量写清环境和复现步骤。
        如果涉及 API key / Token / 私密对话，请不要贴完整内容。

  - type: textarea
    id: problem
    attributes:
      label: 发生了什么？
      description: 简短描述 bug 现象。
      placeholder: 例如：手机端打开关于页后翻页闪烁 / 搜索接口返回 403...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 如何复现？
      description: 按步骤写出来。
      placeholder: |
        1. 打开...
        2. 点击...
        3. 出现...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你期望它怎样？
      placeholder: 例如：应该正常翻页，不闪烁。

  - type: dropdown
    id: device
    attributes:
      label: 设备类型
      options:
        - Android 手机
        - iPhone
        - Windows 桌面浏览器
        - macOS 桌面浏览器
        - 其他

  - type: input
    id: browser
    attributes:
      label: 浏览器 / 系统版本
      placeholder: 例如：OPPO Find X7 Ultra / ColorOS / Chrome 版本...

  - type: textarea
    id: logs
    attributes:
      label: 控制台日志 / 截图
      description: 如果方便，贴错误日志或截图。不要包含 API key。
